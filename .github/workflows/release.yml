name: Publish Android APK on Release

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Attach Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f android/app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            else
              echo "Error: android/app/google-services.json not found and GOOGLE_SERVICES_JSON secret not set."
              exit 1
            fi
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare Release Asset
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/money_manager.apk
          cp build/app/outputs/flutter-apk/app-release.apk "dist/quantro-${{ github.ref_name }}.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/money_manager.apk
            dist/quantro-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
